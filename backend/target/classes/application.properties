server.port=8080

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Agent exec: runner URL and allowlist (pipe-separated; also supports env AGENT_ALLOWED_COMMANDS)
agent.runner.base-url=${AGENT_RUNNER_BASE_URL:http://runner:8090}
agent.allowed-commands=./mvnw -B -ntp test|./mvnw -B -ntp -DskipTests package|sh -lc "echo START; sleep 2; echo END"

# How long we allow the underlying command to run (seconds)
agent.command-timeout-seconds=180

# Backend -> runner HTTP timeouts (milliseconds)
agent.runner.connect-timeout-ms=5000
agent.runner.read-timeout-ms=300000

# Datasource
# SPRING_DATASOURCE_URL
# SPRING_DATASOURCE_USERNAME
# SPRING_DATASOURCE_PASSWORD
