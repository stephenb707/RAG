services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    volumes:
      - "C:/Users/steph/OneDrive/Documents:/repos:rw"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragdb
      SPRING_DATASOURCE_USERNAME: raguser
      SPRING_DATASOURCE_PASSWORD: ragpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAG_REPO_ROOTS: "/repos"
      AGENT_RUNNER_URL: "http://runner:8090"
      AGENT_RUNNER_BASE_URL: "http://runner:8090"
      AGENT_MAX_FILE_BYTES: "200000"
      AGENT_MAX_PATCH_FILES: "3"
      AGENT_ALLOWED_COMMANDS: ""
      AGENT_ALLOWED_EXECUTABLES: "./mvnw"
      AGENT_MVN_ALLOWED_GOALS: "test,verify,package"
      AGENT_MVN_ALLOWED_FLAGS: "-B,-ntp,-DskipTests"
      AGENT_MVN_ALLOWED_D_PROPS: "test"
      AGENT_COMMAND_TIMEOUT_SECONDS: "900"
      AGENT_COMMAND_MAX_OUTPUT_BYTES: "400000"

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-tests:
    profiles: ["test"]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-network
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ragdb_test
      SPRING_DATASOURCE_USERNAME: raguser
      SPRING_DATASOURCE_PASSWORD: ragpass
      OPENAI_API_KEY: test-key
    command:
      [
        "bash",
        "-lc",
        "until (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do echo 'Waiting for Postgres...'; sleep 1; done; mvn -e verify"
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rag-network

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: rag-runner
    volumes:
      - "C:/Users/steph/OneDrive/Documents:/repos:rw"
    environment:
      RUNNER_REPO_ROOT: "/repos"
      RUNNER_MAX_OUTPUT_BYTES: "400000"
      RUNNER_TIMEOUT_SECONDS: "900"
    expose:
      - "8090"
    networks:
      - rag-network
    ports:
      - "8090:8090"


volumes:
  postgres_data:

networks:
  rag-network:
    driver: bridge
